<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's Flying Tonight — USA Moths</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f8f7f4;
    --surface: #ffffff;
    --border: #e2e0da;
    --text: #1a1a18;
    --muted: #6b6960;
    --accent: #3d6b2e;
    --accent-light: #eaf3de;
    --accent-text: #2a4d1f;
    --amber: #854f0b;
    --amber-light: #faeeda;
    --gray-light: #f1efe8;
    --gray-text: #5f5e5a;
    --info: #185fa5;
    --danger: #a32d2d;
    --danger-light: #fcebeb;
    --radius: 10px;
    --radius-sm: 6px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1.25rem 2rem;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header .moon { font-size: 28px; }

  header h1 {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  header p {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }

  .search-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.5rem;
  }

  .search-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .search-row input {
    flex: 1;
    min-width: 200px;
    height: 40px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0 12px;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }

  .search-row input:focus { border-color: var(--accent); }

  .btn {
    height: 40px;
    padding: 0 16px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s;
  }

  .btn:hover { background: var(--bg); border-color: #aaa; }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 500;
  }

  .btn-primary:hover { background: var(--accent-text); border-color: var(--accent-text); }

  .status-bar {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    background: var(--gray-light);
    color: var(--muted);
    display: none;
  }

  .status-bar.error {
    background: var(--danger-light);
    color: var(--danger);
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }

  .controls label { font-size: 13px; color: var(--muted); }

  .controls select {
    height: 34px;
    padding: 0 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }

  .result-count {
    margin-left: auto;
    font-size: 13px;
    color: var(--muted);
  }

  .moth-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px;
  }

  .moth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: box-shadow 0.15s, transform 0.15s;
  }

  .moth-card:hover {
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    transform: translateY(-2px);
  }

  .moth-img {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    background: var(--gray-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
  }

  .moth-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .moth-body {
    padding: 10px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }

  .moth-common {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }

  .moth-sci {
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
    line-height: 1.3;
  }

  .moth-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
  }

  .moth-obs {
    font-size: 11px;
    color: var(--muted);
  }

  .badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 99px;
    letter-spacing: 0.3px;
  }

  .badge-common { background: var(--accent-light); color: var(--accent-text); }
  .badge-occasional { background: var(--amber-light); color: var(--amber); }
  .badge-rare { background: var(--gray-light); color: var(--gray-text); }

  .moth-link {
    display: block;
    margin-top: 8px;
    font-size: 11px;
    color: var(--info);
    text-decoration: none;
  }

  .moth-link:hover { text-decoration: underline; }

  .skeleton {
    background: var(--gray-light);
    border-radius: var(--radius);
    height: 240px;
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 3rem;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.8;
  }

  .empty .emoji { font-size: 40px; display: block; margin-bottom: 12px; }

  footer {
    margin-top: 3rem;
    padding: 1.5rem;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--border);
  }

  footer a { color: var(--info); }

  @media (max-width: 600px) {
    header { padding: 1rem; }
    main { padding: 1rem; }
    .moth-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  }
</style>
</head>
<body>

<header>
  <span class="moon">🌕</span>
  <div>
    <h1>What's Flying Tonight?</h1>
    <p>Moths recorded near you at this time of year · USA · Powered by iNaturalist</p>
  </div>
</header>

<main>
  <div class="search-section">
    <div class="search-row">
      <input type="text" id="loc-input" placeholder="Enter city, state or ZIP code…" />
      <button class="btn btn-primary" onclick="searchByText()">🔍 Search</button>
      <button class="btn" onclick="geoLocate()">📍 Use my location</button>
    </div>
    <div class="status-bar" id="status"></div>
  </div>

  <div id="controls-row" style="display:none;" class="controls">
    <label for="sort-sel">Sort:</label>
    <select id="sort-sel" onchange="renderMoths()">
      <option value="count">Most observed</option>
      <option value="alpha">Name A–Z</option>
    </select>
    <label for="fam-sel" style="margin-left:8px;">Family:</label>
    <select id="fam-sel" onchange="renderMoths()">
      <option value="">All families</option>
    </select>
    <span class="result-count" id="result-count"></span>
  </div>

  <div class="moth-grid" id="results"></div>
</main>

<footer>
  Data from <a href="https://www.inaturalist.org" target="_blank">iNaturalist</a> (research-grade observations) ·
  Location lookup via <a href="https://nominatim.openstreetmap.org" target="_blank">Nominatim / OpenStreetMap</a> ·
  Inspired by <a href="https://connect-apps.ceh.ac.uk/whats_flying_tonight/" target="_blank">CEH's What's Flying Tonight</a>
</footer>

<script>
const MOTH_TAXON_ID = 47157;
const RADIUS_KM = 80;
const WINDOW_DAYS = 14;
let allMoths = [];

function setStatus(msg, isError) {
  const el = document.getElementById('status');
  el.style.display = msg ? 'block' : 'none';
  el.className = 'status-bar' + (isError ? ' error' : '');
  el.textContent = msg;
}

function getMonths() {
  const now = new Date();
  const months = new Set();
  for (let d = -WINDOW_DAYS; d <= WINDOW_DAYS; d++) {
    const dt = new Date(now);
    dt.setDate(now.getDate() + d);
    months.add(dt.getMonth() + 1);
  }
  return [...months].join(',');
}

function showSkeletons() {
  const r = document.getElementById('results');
  r.innerHTML = Array(12).fill('<div class="skeleton"></div>').join('');
}

function populateFamilies() {
  const fams = [...new Set(allMoths.map(m => m.family).filter(Boolean))].sort();
  const sel = document.getElementById('fam-sel');
  sel.innerHTML = '<option value="">All families</option>' +
    fams.map(f => `<option value="${f}">${f}</option>`).join('');
}

function renderMoths() {
  const sort = document.getElementById('sort-sel').value;
  const fam = document.getElementById('fam-sel').value;
  let moths = [...allMoths];
  if (fam) moths = moths.filter(m => m.family === fam);
  if (sort === 'count') moths.sort((a, b) => b.count - a.count);
  else moths.sort((a, b) => a.name.localeCompare(b.name));

  document.getElementById('result-count').textContent = `${moths.length} species`;

  const r = document.getElementById('results');
  if (!moths.length) {
    r.innerHTML = '<div class="empty"><span class="emoji">🔍</span>No moths found for this filter.<br>Try a different family or clear the filter.</div>';
    return;
  }

  r.innerHTML = moths.map(m => {
    const badge = m.count > 50
      ? '<span class="badge badge-common">Common</span>'
      : m.count > 10
        ? '<span class="badge badge-occasional">Occasional</span>'
        : '<span class="badge badge-rare">Rare</span>';

    const imgContent = m.photo
      ? `<img src="${m.photo}" alt="${m.name}" loading="lazy" onerror="this.parentElement.innerHTML='<span style=font-size:40px>🦋</span>'">`
      : '<span style="font-size:40px">🦋</span>';

    return `<div class="moth-card">
      <div class="moth-img">${imgContent}</div>
      <div class="moth-body">
        <div class="moth-common">${m.name}</div>
        <div class="moth-sci">${m.sci}</div>
        <div class="moth-footer">
          <span class="moth-obs">👁 ${m.count.toLocaleString()} obs</span>
          ${badge}
        </div>
        <a class="moth-link" href="https://www.inaturalist.org/taxa/${m.id}" target="_blank">View on iNaturalist →</a>
      </div>
    </div>`;
  }).join('');
}

async function fetchMoths(lat, lng, locationName) {
  setStatus(`Searching for moths near ${locationName}…`);
  showSkeletons();
  document.getElementById('controls-row').style.display = 'none';

  const months = getMonths();
  const BUTTERFLY_TAXON_ID = 47224;
  const url = `https://api.inaturalist.org/v1/observations/species_counts` +
    `?taxon_id=${MOTH_TAXON_ID}` +
    `&without_taxon_id=${BUTTERFLY_TAXON_ID}` +
    `&lat=${lat}&lng=${lng}&radius=${RADIUS_KM}` +
    `&month=${months}` +
    `&quality_grade=research` +
    `&place_id=1` +
    `&per_page=60&order=desc&order_by=observations_count`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    if (!data.results || !data.results.length) {
      allMoths = [];
      document.getElementById('results').innerHTML =
        '<div class="empty"><span class="emoji">🌑</span>No moth records found near this location for this time of year.<br>Try a different city or expand your search.</div>';
      setStatus('');
      return;
    }

    allMoths = data.results.map(r => ({
      id: r.taxon.id,
      name: r.taxon.preferred_common_name || r.taxon.name,
      sci: r.taxon.name,
      photo: r.taxon.default_photo ? r.taxon.default_photo.medium_url : null,
      count: r.count,
      family: r.taxon.iconic_taxon_name || ''
    }));

    const total = data.results.reduce((s, r) => s + r.count, 0);
    setStatus(`${allMoths.length} moth species · ${total.toLocaleString()} total observations · within ${RADIUS_KM}km of ${locationName} · around this time of year`);

    populateFamilies();
    document.getElementById('controls-row').style.display = 'flex';
    renderMoths();
  } catch (e) {
    console.error(e);
    setStatus('Could not load data from iNaturalist. Check your internet connection and try again.', true);
    document.getElementById('results').innerHTML = '';
  }
}

async function searchByText() {
  const q = document.getElementById('loc-input').value.trim();
  if (!q) return;
  setStatus('Looking up location…');
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q + ' USA')}&format=json&limit=1`);
    const data = await res.json();
    if (!data.length) {
      setStatus('Location not found. Try a city name, state, or ZIP code.', true);
      return;
    }
    const { lat, lon, display_name } = data[0];
    const name = display_name.split(',').slice(0, 2).join(', ').trim();
    document.getElementById('loc-input').value = name;
    fetchMoths(parseFloat(lat).toFixed(5), parseFloat(lon).toFixed(5), name);
  } catch (e) {
    setStatus('Could not look up that location. Please try again.', true);
  }
}

function geoLocate() {
  if (!navigator.geolocation) {
    setStatus('Geolocation is not supported by your browser. Search by city name instead.', true);
    return;
  }
  setStatus('Getting your location…');
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = pos.coords.latitude.toFixed(5);
    const lng = pos.coords.longitude.toFixed(5);
    let name = `${lat}, ${lng}`;
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`);
      const d = await res.json();
      name = d.address.city || d.address.town || d.address.county || d.address.state || name;
    } catch (e) {}
    document.getElementById('loc-input').value = name;
    fetchMoths(lat, lng, name);
  }, () => {
    setStatus('Could not get your location. Search by city name instead.', true);
  });
}

document.getElementById('loc-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchByText();
});

geoLocate();
</script>
</body>
</html>
